global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    environment: {{ .Values.environment }}
scrape_configs:
  - job_name: bank-infra
    static_configs:
      - targets: [otel-collector:9465]
    metric_relabel_configs:
      # Exclude short-lived RPC reply queues from persisted metrics.
      - source_labels: [rabbitmq_queue_name]
        regex: 'amq[.]gen-.*'
        action: drop
  - job_name: bank-system
    static_configs:
      - targets: [otel-collector:9466]
  - job_name: bank-otel
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
