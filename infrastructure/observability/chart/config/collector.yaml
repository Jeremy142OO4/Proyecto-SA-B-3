extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  k8s_cluster:
    auth_type: serviceAccount
    namespaces: [{{ .Values.applicationNamespace }}]
    collection_interval: 30s
  rabbitmq:
    endpoint: http://rabbitmq.{{ .Values.applicationNamespace }}.svc.cluster.local:15672
    username: ${env:RABBITMQ_USER}
    password: ${env:RABBITMQ_PASSWORD}
    collection_interval: 30s
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  prometheus/infra:
    endpoint: 0.0.0.0:9465
    metric_expiration: 2m
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 256
      num_consumers: 2
    retry_on_failure:
      max_elapsed_time: 60s
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true
    metric_expiration: 5m
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      queue_size: 256
      num_consumers: 2
    retry_on_failure:
      max_elapsed_time: 60s
service:
  extensions: [health_check]
  pipelines:
    metrics/infra:
      receivers: [k8s_cluster, rabbitmq]
      processors: [memory_limiter, batch]
      exporters: [prometheus/infra]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
