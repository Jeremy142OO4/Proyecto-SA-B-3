apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-backends
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-to-collector
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: otel-collector}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.applicationNamespace }}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}]
