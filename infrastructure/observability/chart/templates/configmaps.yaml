{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
data:
  config.yaml: |
{{ tpl ($.Files.Get (printf "config/%s" $component.config)) $ | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-logs-config
data:
  config.yaml: |
{{ tpl (.Files.Get "config/agent.yaml") . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: bank-usac
        folder: Bank USAC
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/bank-dashboards
  overview.json: |
{{ .Files.Get "dashboards/overview.json" | indent 4 }}
