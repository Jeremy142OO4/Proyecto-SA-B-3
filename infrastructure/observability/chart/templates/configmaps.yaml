{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
data:
  config.yaml: |
{{ tpl ($.Files.Get (printf "config/%s" $component.config)) $ | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-logs-config
data:
  config.yaml: |
{{ tpl (.Files.Get "config/agent.yaml") . | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: bank-usac
        folder: Bank USAC
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/bank-dashboards
  overview.json: |
{{ include "bank.profile" (dict "root" . "content" (.Files.Get "dashboards/overview.json")) | indent 4 }}
  slo.json: |
{{ include "bank.profile" (dict "root" . "content" (.Files.Get "dashboards/slo.json")) | indent 4 }}
  prueba1.json: |
{{ include "bank.profile" (dict "root" . "content" (.Files.Get "dashboards/prueba1.json")) | indent 4 }}
  sistema.json: |
{{ include "bank.profile" (dict "root" . "content" (.Files.Get "dashboards/sistema.json")) | indent 4 }}
  scenarios.json: |
{{ .Files.Get "dashboards/scenarios.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
data:
  bank.json: |
{{ include "bank.profile" (dict "root" . "content" (.Files.Get "alerting/bank.json")) | indent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-system-exporter
data:
  system_exporter.py: |
{{ .Files.Get "config/system_exporter.py" | indent 4 }}
