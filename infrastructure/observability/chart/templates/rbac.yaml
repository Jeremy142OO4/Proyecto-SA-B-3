apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-observability
automountServiceAccountToken: false
{{- /* Retain the existing dev reader when promoting this persistent Helm release.
The collector watches only applicationNamespace; no cluster-wide grants. */}}
{{- $namespaces := list "bank-usac-dev" }}
{{- if ne .Values.applicationNamespace "bank-usac-dev" }}
{{- $namespaces = append $namespaces .Values.applicationNamespace }}
{{- end }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bank-observability
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [events, persistentvolumeclaims, pods, pods/status, replicationcontrollers, replicationcontrollers/status, resourcequotas, services]
    verbs: [get, list, watch]
  - apiGroups: [apps, extensions]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bank-observability
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bank-observability
subjects:
  - kind: ServiceAccount
    name: bank-observability
    namespace: {{ $.Release.Namespace }}
{{- end }}
