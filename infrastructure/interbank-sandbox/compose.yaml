name: bank-usac-interbank-sandbox

# Independent data, network and broker. No cloud credentials, volumes or URLs.
x-bank: &bank
  ENTORNO: interbank-sandbox
  DEPLOYMENT_ENVIRONMENT: interbank-sandbox
  INTERBANK_ENABLED: 'true'
  INTERBANK_TEST_MODE: 'true'
  INTERBANK_BANK_CODE: BANK03
  INTERBANK_PARTNER_BANK_CODE: BANK14
  INTERBANK_PARTNER_BASE_URL: http://127.0.0.1:8099/interbank/v1
  INTERBANK_PARTNER_API_KEY: sandbox-mock-only-api-key-2026
  URL_RABBITMQ: amqp://sandbox:sandbox-local-only@rabbit:5672/
  JWT_SECRET: sandbox-only-jwt-secret-not-for-cloud-2026

services:
  database:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: sandbox-local-only
    volumes:
      - sandbox-db:/var/lib/postgresql/data
      - ./database-init.sh:/docker-entrypoint-initdb.d/10-sandbox.sh:ro,Z
      - ../../services:/schemas:ro,Z
    healthcheck:
      test: ['CMD-SHELL', 'psql -U postgres -d accounts -tAc ''SELECT count(*)>0 FROM cuentas'' | grep -qx t']
      interval: 5s
      retries: 30
    networks: [sandbox]

  rabbit:
    image: docker.io/library/rabbitmq:3.13-alpine
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sandbox
      RABBITMQ_DEFAULT_PASS: sandbox-local-only
      ERL_FLAGS: '+S 2:2 +A 4'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      retries: 30
    volumes: [sandbox-rabbit:/var/lib/rabbitmq]
    networks: [sandbox]

  gateway:
    build: ../../gateway/api-gateway
    environment:
      <<: *bank
      PUERTO_HTTP: '8080'
      INTERBANK_API_KEY: sandbox-callback-only-api-key-2026
      INTERBANK_MOCK_CONTROL_URL: http://127.0.0.1:8099
      MOCK_CONTROL_KEY: sandbox-private-control-key-2026
      CORS_ORIGINS: http://localhost:8180,http://127.0.0.1:8180
    depends_on:
      rabbit: { condition: service_healthy }
    networks: [sandbox]

  mock:
    build:
      context: ../..
      dockerfile: tools/interbank_mock/Dockerfile
    # Loopback shared ONLY with the sandbox Gateway/transaction service.
    network_mode: service:gateway
    environment:
      MOCK_API_KEY: sandbox-mock-only-api-key-2026
      MOCK_CONTROL_KEY: sandbox-private-control-key-2026
      MOCK_PARTNER_BASE_URL: http://127.0.0.1:8080/interbank/v1
      MOCK_PARTNER_API_KEY: sandbox-callback-only-api-key-2026
    depends_on: [gateway]
    volumes: [sandbox-mock:/app/state]

  transactions:
    build: ../../services/transaction-service
    network_mode: service:gateway
    environment:
      <<: *bank
      PUERTO_HTTP: '8083'
      URL_BASE_DATOS: postgres://postgres:sandbox-local-only@database:5432/transactions?sslmode=disable
    depends_on:
      database: { condition: service_healthy }
      rabbit: { condition: service_healthy }
      mock: { condition: service_started }

  accounts:
    build: ../../services/account-service
    environment:
      <<: *bank
      URL_BASE_DATOS: postgres://postgres:sandbox-local-only@database:5432/accounts?sslmode=disable
    depends_on:
      database: { condition: service_healthy }
      rabbit: { condition: service_healthy }
    networks: [sandbox]

  customers:
    build: ../../services/service-customer
    environment:
      <<: *bank
      DATABASE_URL: postgres://postgres:sandbox-local-only@database:5432/customers?sslmode=disable
      RABBITMQ_URL: amqp://sandbox:sandbox-local-only@rabbit:5672/
    depends_on:
      database: { condition: service_healthy }
      rabbit: { condition: service_healthy }
    networks: [sandbox]

  frontend:
    build: ../../frontend/bank-usac-web
    environment:
      BACKEND_URL: http://gateway:8080
    ports: ['127.0.0.1:8180:80']
    depends_on: [gateway, customers, accounts, transactions]
    networks: [sandbox]

volumes:
  sandbox-db:
  sandbox-mock:
  sandbox-rabbit:
networks:
  sandbox:
    internal: true
