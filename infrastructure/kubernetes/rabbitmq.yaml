apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-datos
  namespace: bank-usac
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: bank-usac
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: panel, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: RABBITMQ_USUARIO } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: RABBITMQ_CLAVE } }
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, ping] }
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: datos, mountPath: /var/lib/rabbitmq }
      volumes:
        - name: datos
          persistentVolumeClaim: { claimName: rabbitmq-datos }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: bank-usac
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: panel, port: 15672, targetPort: panel }
