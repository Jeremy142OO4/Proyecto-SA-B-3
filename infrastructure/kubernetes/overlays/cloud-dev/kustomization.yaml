apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-usac-dev
resources:
  - ../../base
patches:
  - path: patch-configuracion-dev.yaml
  # Dev prioritizes the two-node budget over zero-downtime rolling updates.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (api-gateway|customer-service|account-service|transaction-service|payment-service|notification-audit-service)
    patch: |-
      - op: replace
        path: /spec/strategy/rollingUpdate/maxSurge
        value: 0
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 1
