apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bank-usac
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: esperar-rabbitmq
          image: alpine:3.22
          command: [sh, -c, "until nc -z rabbitmq 5672; do sleep 2; done"]
      containers:
        - name: api-gateway
          image: bank-usac/api-gateway:local
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: bank-usac-config }
          env:
            - { name: PUERTO_HTTP, value: "8080" }
            - name: URL_RABBITMQ
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: URL_RABBITMQ } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bank-usac
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
