apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-service-config
  labels:
    app: customer-service
data:
  PORT: "8081"
  DB_HOST: "host.minikube.internal"
  DB_PORT: "5432"
  DB_NAME: "customer_db"
  DB_USER: "customer_user"
  DB_SSLMODE: "disable"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  RABBITMQ_EXCHANGE_EVENTS: "bank.events"
  RABBITMQ_EXCHANGE_COMMANDS: "bank.commands"
---
apiVersion: v1
kind: Secret
metadata:
  name: customer-service-secret
  labels:
    app: customer-service
type: Opaque
stringData:
  DB_PASSWORD: "customer_password"
  JWT_SECRET: "usac_super_secret_jwt_key_2026_safe"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels:
    app: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: customer-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: customer-service-config
            - secretRef:
                name: customer-service-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  labels:
    app: customer-service
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
    - port: 8081
      targetPort: 8081