apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-audit-service
  namespace: bank-usac
  labels:
    app: notification-audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-audit-service
  template:
    metadata:
      labels:
        app: notification-audit-service
    spec:
      initContainers:
        - name: esperar-dependencias
          image: alpine:3.22
          command: ["sh", "-c", "until nc -z rabbitmq 5672 && nc -z host.minikube.internal 5436; do sleep 2; done"]
      containers:
        - name: notification-audit-service
          image: bank-usac/notification-audit-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bank-usac-secrets
                  key: URL_BASE_DATOS_AUDITORIA
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: bank-usac-secrets
                  key: URL_RABBITMQ
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bank-usac-secrets
                  key: JWT_SECRET
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: SMTP_PORT } }
            - name: SMTP_USERNAME
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: SMTP_USERNAME } }
            - name: SMTP_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: SMTP_APP_PASSWORD } }
            - name: SMTP_FROM
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: SMTP_FROM } }
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-audit-service
  namespace: bank-usac
  labels:
    app: notification-audit-service
spec:
  selector:
    app: notification-audit-service
  ports:
    - name: http
      port: 8085
      targetPort: http
