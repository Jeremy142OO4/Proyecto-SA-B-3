apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-audit-service-config
  labels:
    app: notification-audit-service
data:
  PORT: "8085"
  DB_HOST: "host.minikube.internal"
  DB_PORT: "5435"
  DB_NAME: "audit_db"
  DB_USER: "audit_user"
  DB_SSLMODE: "disable"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  RABBITMQ_EXCHANGE_EVENTS: "bank.events"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-audit-service-secret
  labels:
    app: notification-audit-service
type: Opaque
stringData:
  DB_PASSWORD: "audit_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-audit-service
  labels:
    app: notification-audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-audit-service
  template:
    metadata:
      labels:
        app: notification-audit-service
    spec:
      containers:
        - name: notification-audit-service
          image: notification-audit-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: notification-audit-service-config
            - secretRef:
                name: notification-audit-service-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-audit-service
  labels:
    app: notification-audit-service
spec:
  type: ClusterIP
  selector:
    app: notification-audit-service
  ports:
    - port: 8085
      targetPort: 8085