apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: bank-usac
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      initContainers:
        - name: esperar-dependencias
          image: alpine:3.22
          command: [sh, -c, "until nc -z rabbitmq 5672 && nc -z host.minikube.internal 5434; do sleep 2; done"]
      containers:
        - name: payment-service
          image: bank-usac/payment-service:local
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8084 }
          envFrom:
            - configMapRef: { name: bank-usac-config }
          env:
            - { name: PUERTO_HTTP, value: "8084" }
            - name: URL_BASE_DATOS
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: URL_BASE_DATOS_PAGOS } }
            - name: URL_RABBITMQ
              valueFrom: { secretKeyRef: { name: bank-usac-secrets, key: URL_RABBITMQ } }
          readinessProbe:
            httpGet: { path: /salud, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /salud, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: bank-usac
spec:
  selector: { app: payment-service }
  ports:
    - { name: http, port: 8084, targetPort: http }
