name: CI/CD Bank USAC

on:
  push:
    branches:
      - "feature/**"
      - develop
      - "release/**"
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: jeremy142004
  OMITIR_PRUEBAS: "false"

jobs:
  detectar-cambios:
    name: Detectar componentes modificados
    runs-on: ubuntu-latest
    outputs:
      matriz_go: ${{ steps.filtros.outputs.matriz_go }}
      matriz_imagenes: ${{ steps.filtros.outputs.matriz_imagenes }}
      componentes: ${{ steps.filtros.outputs.componentes }}
      hay_go: ${{ steps.filtros.outputs.hay_go }}
      hay_frontend: ${{ steps.filtros.outputs.hay_frontend }}
      hay_componentes: ${{ steps.filtros.outputs.hay_componentes }}
    steps:
      - name: Descargar codigo con historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular filtros por ruta
        id: filtros
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA_ANTERIOR: ${{ github.event.before }}
          SHA_BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          gateway=false
          account=false
          payment=false
          transaction=false
          customer=false
          notification=false
          frontend=false
          todos=false

          # Una version de release debe contener todas las imagenes con la misma
          # etiqueta. El despacho manual tambien ejecuta una validacion completa.
          if [[ "$EVENTO" == "workflow_dispatch" || "$REF" == refs/heads/release/* || "$REF" == refs/tags/v* ]]; then
            todos=true
          else
            if [[ "$EVENTO" == "pull_request" ]]; then
              base="$SHA_BASE_PR"
            else
              base="$SHA_ANTERIOR"
            fi

            if [[ -z "${base:-}" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            fi

            mapfile -t archivos < <(git diff --name-only "$base" "$GITHUB_SHA")
            printf 'Archivos evaluados:\n'
            printf ' - %s\n' "${archivos[@]}"

            for archivo in "${archivos[@]}"; do
              case "$archivo" in
                gateway/api-gateway/*) gateway=true ;;
                services/account-service/*) account=true ;;
                services/payment-service/*) payment=true ;;
                services/transaction-service/*) transaction=true ;;
                services/service-customer/*) customer=true ;;
                services/service-notification-audit/*) notification=true ;;
                frontend/bank-usac-web/*) frontend=true ;;
                infrastructure/*|docker-compose.yml|.github/workflows/*|go.work|go.work.sum)
                  todos=true
                  ;;
              esac
            done
          fi

          if [[ "$todos" == "true" ]]; then
            gateway=true
            account=true
            payment=true
            transaction=true
            customer=true
            notification=true
            frontend=true
          fi

          matriz_go="$(jq -cn \
            --argjson gateway "$gateway" \
            --argjson account "$account" \
            --argjson payment "$payment" \
            --argjson transaction "$transaction" \
            --argjson customer "$customer" \
            --argjson notification "$notification" \
            '{include: [
              {activo:$gateway,id:"api-gateway",nombre:"API Gateway",directorio:"gateway/api-gateway",categorias:false},
              {activo:$account,id:"account-service",nombre:"Account Service",directorio:"services/account-service",categorias:true},
              {activo:$payment,id:"payment-service",nombre:"Payment Service",directorio:"services/payment-service",categorias:true},
              {activo:$transaction,id:"transaction-service",nombre:"Transaction Service",directorio:"services/transaction-service",categorias:true},
              {activo:$customer,id:"customer-service",nombre:"Customer Service",directorio:"services/service-customer",categorias:true},
              {activo:$notification,id:"notification-audit-service",nombre:"Notification Audit Service",directorio:"services/service-notification-audit",categorias:true}
            ] | map(select(.activo)) | map(del(.activo))}')"

          matriz_imagenes="$(jq -cn \
            --argjson gateway "$gateway" \
            --argjson account "$account" \
            --argjson payment "$payment" \
            --argjson transaction "$transaction" \
            --argjson customer "$customer" \
            --argjson notification "$notification" \
            --argjson frontend "$frontend" \
            '{include: [
              {activo:$gateway,id:"api-gateway",nombre:"API Gateway",directorio:"gateway/api-gateway",imagen:"bank-usac-api-gateway"},
              {activo:$account,id:"account-service",nombre:"Account Service",directorio:"services/account-service",imagen:"bank-usac-account-service"},
              {activo:$payment,id:"payment-service",nombre:"Payment Service",directorio:"services/payment-service",imagen:"bank-usac-payment-service"},
              {activo:$transaction,id:"transaction-service",nombre:"Transaction Service",directorio:"services/transaction-service",imagen:"bank-usac-transaction-service"},
              {activo:$customer,id:"customer-service",nombre:"Customer Service",directorio:"services/service-customer",imagen:"bank-usac-customer-service"},
              {activo:$notification,id:"notification-audit-service",nombre:"Notification Audit Service",directorio:"services/service-notification-audit",imagen:"bank-usac-notification-audit-service"},
              {activo:$frontend,id:"frontend",nombre:"Frontend",directorio:"frontend/bank-usac-web",imagen:"bank-usac-frontend"}
            ] | map(select(.activo)) | map(del(.activo))}')"

          componentes="$(echo "$matriz_imagenes" | jq -c '[.include[].id]')"
          cantidad_go="$(echo "$matriz_go" | jq '.include | length')"
          cantidad_componentes="$(echo "$matriz_imagenes" | jq '.include | length')"

          echo "matriz_go=$matriz_go" >> "$GITHUB_OUTPUT"
          echo "matriz_imagenes=$matriz_imagenes" >> "$GITHUB_OUTPUT"
          echo "componentes=$componentes" >> "$GITHUB_OUTPUT"
          echo "hay_go=$([[ "$cantidad_go" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "hay_frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "hay_componentes=$([[ "$cantidad_componentes" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          echo "Componentes seleccionados: $componentes"
          {
            echo "## Componentes detectados"
            echo "| Componente | Estado |"
            echo "| --- | --- |"
            if [[ "$gateway" == "true" ]]; then echo "| API Gateway | ✅ Ejecutar |"; else echo "| API Gateway | ⏭️ Omitido |"; fi
            if [[ "$customer" == "true" ]]; then echo "| Clientes | ✅ Ejecutar |"; else echo "| Clientes | ⏭️ Omitido |"; fi
            if [[ "$account" == "true" ]]; then echo "| Cuentas | ✅ Ejecutar |"; else echo "| Cuentas | ⏭️ Omitido |"; fi
            if [[ "$transaction" == "true" ]]; then echo "| Transacciones | ✅ Ejecutar |"; else echo "| Transacciones | ⏭️ Omitido |"; fi
            if [[ "$payment" == "true" ]]; then echo "| Pagos | ✅ Ejecutar |"; else echo "| Pagos | ⏭️ Omitido |"; fi
            if [[ "$notification" == "true" ]]; then echo "| Notificaciones y Auditoria | ✅ Ejecutar |"; else echo "| Notificaciones y Auditoria | ⏭️ Omitido |"; fi
            if [[ "$frontend" == "true" ]]; then echo "| Frontend | ✅ Ejecutar |"; else echo "| Frontend | ⏭️ Omitido |"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-test-gateway:
    name: Build y test - API Gateway
    runs-on: ubuntu-latest
    needs: detectar-cambios
    if: contains(fromJSON(needs.detectar-cambios.outputs.componentes), 'api-gateway')
    defaults:
      run:
        working-directory: gateway/api-gateway
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/api-gateway/go.mod
          cache: true
          cache-dependency-path: gateway/api-gateway/go.sum

      - name: Build
        run: go build ./...

      - name: Pruebas existentes del servicio
        if: env.OMITIR_PRUEBAS != 'true'
        shell: bash
        run: go list ./... | grep -v '/test/' | xargs go test -cover -count=1

      - name: Pruebas unitarias por categoria
        if: false && env.OMITIR_PRUEBAS != 'true'
        run: go test -v -count=1 ./test/unitarias

      - name: Pruebas de integracion por categoria
        if: false && env.OMITIR_PRUEBAS != 'true'
        run: go test -v -count=1 ./test/integracion

      - name: Pruebas E2E por categoria
        if: false && env.OMITIR_PRUEBAS != 'true'
        run: go test -v -count=1 ./test/e2e

      - name: Validacion estatica
        run: go vet ./...

