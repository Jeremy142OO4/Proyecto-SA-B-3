        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"
          else
            VERSION="$GITHUB_SHA"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen versionada
        uses: docker/build-push-action@v6
        with:
          context: gateway/api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/bank-usac-api-gateway:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=bank-usac-api-gateway
          cache-to: type=gha,mode=max,scope=bank-usac-api-gateway

