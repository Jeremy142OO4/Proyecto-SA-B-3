  build-test-frontend:
    name: Build y test - Frontend
    runs-on: ubuntu-latest
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.hay_frontend == 'true'
    defaults:
      run:
        working-directory: frontend/bank-usac-web
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/bank-usac-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  validacion-sistema:
    name: Validacion basica del sistema
    runs-on: ubuntu-latest
    needs:
      - detectar-cambios
      - build-test-gateway
      - build-test-customer
      - build-test-account
      - build-test-transaction
      - build-test-payment
      - build-test-notification
      - build-test-frontend
    if: >-
      always() &&
      needs.detectar-cambios.outputs.hay_componentes == 'true' &&
      needs.detectar-cambios.result == 'success' &&
      (needs.build-test-gateway.result == 'success' || needs.build-test-gateway.result == 'skipped') &&
      (needs.build-test-customer.result == 'success' || needs.build-test-customer.result == 'skipped') &&
      (needs.build-test-account.result == 'success' || needs.build-test-account.result == 'skipped') &&
      (needs.build-test-transaction.result == 'success' || needs.build-test-transaction.result == 'skipped') &&
      (needs.build-test-payment.result == 'success' || needs.build-test-payment.result == 'skipped') &&
      (needs.build-test-notification.result == 'success' || needs.build-test-notification.result == 'skipped') &&
      (needs.build-test-frontend.result == 'success' || needs.build-test-frontend.result == 'skipped')
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar manifiestos Kubernetes
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/dev > /tmp/manifiestos-dev.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/cloud-dev > /tmp/manifiestos-cloud-dev.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/prod > /tmp/manifiestos-prod.yaml

      - name: Comprobar recursos obligatorios
        run: |
          grep -q 'kind: Deployment' /tmp/manifiestos-dev.yaml
          grep -q 'kind: Service' /tmp/manifiestos-dev.yaml
          grep -q 'kind: HorizontalPodAutoscaler' /tmp/manifiestos-dev.yaml
          ! grep -R 'image:.*:latest' infrastructure/kubernetes

      - name: Validar configuracion de Compose
        run: docker compose config --quiet

  publicar-gateway:
    name: Publicar - API Gateway
    runs-on: ubuntu-latest
    needs:
      - detectar-cambios
      - validacion-sistema
    if: >-
      always() && needs.validacion-sistema.result == 'success' &&
      github.event_name == 'push' &&
      contains(fromJSON(needs.detectar-cambios.outputs.componentes), 'api-gateway') &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Determinar version de imagen
